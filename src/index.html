<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="timer-card">
      <p class="eyebrow">Desktop focus session</p>
      <h1>Focus Timer</h1>

      <label for="duration">Session length</label>
      <select id="duration">
        <option value="5">5 seconds, demo</option>
        <option value="1500" selected>25 minutes</option>
        <option value="3000">50 minutes</option>
      </select>

      <p id="timer" class="timer" aria-live="polite">25:00</p>
      <p id="status" class="status" aria-live="polite">Ready to focus</p>

      <div class="controls">
        <button id="start" type="button">Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
